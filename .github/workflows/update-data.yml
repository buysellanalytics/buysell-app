name: update-data
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 update_data.py
      - run: |
          git config user.name "buysell-bot"
          git config user.email "buysell-bot@users.noreply.github.com"
          git add fx.json news.json rates.json
          git diff --cached --quiet || (git commit -m "data" && git push)
